version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: projectflow_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectflow_dev_network

  redis:
    image: redis:7-alpine
    container_name: projectflow_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_secret_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectflow_dev_network

  minio:
    image: minio/minio:latest
    container_name: projectflow_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - projectflow_dev_network

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:

networks:
  projectflow_dev_network:
    driver: bridge
